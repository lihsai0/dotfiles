patch:
  schema_list:
    # - schema: luna_pinyin          # 朙月拼音
    # - schema: luna_pinyin_simp     # 朙月拼音 简化字模式
    # - schema: luna_pinyin_tw       # 朙月拼音 臺灣正體模式
    # - schema: terra_pinyin         # 地球拼音 dì qiú pīn yīn
    # - schema: bopomofo             # 注音
    # - schema: bopomofo_tw          # 注音 臺灣正體模式
    # - schema: cangjie5             # 倉頡五代
    # - schema: cangjie5_express     # 倉頡 快打模式
    # 雾凇拼音，请先安装[配置包](https://github.com/iDvel/rime-ice)
    - schema: rime_ice
    # 以下方案非预装，请先安裝[配置包](https://rime.im/recipes/)再启用
    # - schema: quick5               # 速成
    # - schema: jyutping             # 粵拼
    # - schema: wubi86               # 五笔86
    - schema: wubi_pinyin # 五笔拼音混合輸入
    # - schema: combo_pinyin         # 宮保拼音
    # - schema: double_pinyin        # 自然碼雙拼
    # - schema: double_pinyin_mspy   # 微軟雙拼
    # - schema: double_pinyin_abc    # 智能ABC雙拼
    # - schema: double_pinyin_flypy  # 小鶴雙拼
    # - schema: wugniu               # 吳語上海話（新派）
    # - schema: wugniu_lopha         # 吳語上海話（老派）
    # - schema: sampheng             # 中古漢語三拼
    # - schema: zyenpheng            # 中古漢語全拼
    # - schema: ipa_xsampa           # X-SAMPA 國際音標
    # - schema: emoji                # emoji表情

  # 中/英文切换
  #
  # good_old_caps_lock 控制 CapsLock 的行为，仅限 rime 内部。
  # false 切换中/英文，但是大写状态灯依然会打开
  # true  切换大/小写
  # macOS 系统设置的优先级更高，如果勾选【使用大写锁定键切换“ABC”输入法】则始终会切换输入法。
  #
  # switch_key 控制切换中/英文时的上屏规则
  # commit_code  上屏原始的编码，然后切换到英文
  # commit_text  上屏拼出的词句，然后切换到英文
  # clear        清除未上屏内容，然后切换到英文
  # inline_ascii 切换到临时英文模式，按回车上屏后回到中文状态
  # noop         屏蔽快捷键，不切换中英。注意不要屏蔽 CapsLock
  ascii_composer/+:
    # 控制 CapsLock 的行为，仅限 rime。
    # - true: 用于切换大小
    good_old_caps_lock: false
    switch_key:
      Caps_Lock: coop
      Shift_L: noop
      Shift_R: noop
      Control_L: noop
      Control_R: noop

  # 将输入内容作为词考虑
  # 通常用于在字符后拼接数字，不把数字输入当作选择候选词处理
  recognizer/patterns/+:
    lihsai0: "^lihsai0$"

  # 使用 Emacs 按键绑定
  key_binder/bindings/+:
    # emacs_editing:
    - { when: composing, accept: Control+p, send: Up }
    - { when: composing, accept: Control+n, send: Down }
    - { when: composing, accept: Control+b, send: Left }
    - { when: composing, accept: Control+f, send: Right }
    - { when: composing, accept: Control+a, send: Home }
    - { when: composing, accept: Control+e, send: End }
    - { when: composing, accept: Control+d, send: Delete }
    - { when: composing, accept: Control+k, send: Shift+Delete }
    - { when: composing, accept: Control+h, send: BackSpace }
    - { when: composing, accept: Control+g, send: Escape }
    - { when: composing, accept: Control+bracketleft, send: Escape }
    - { when: composing, accept: Control+y, send: Page_Up }
    - { when: composing, accept: Alt+v, send: Page_Up }
    - { when: composing, accept: Control+v, send: Page_Down }

  # 使用 6 个候选词
  menu/page_size: 6

  punctuator/half_shape/`: "`"
